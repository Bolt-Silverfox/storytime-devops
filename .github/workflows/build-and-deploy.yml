# ---------------------------------------------------------------------------
# Reusable workflow: build a service's production image, push it to ECR, and
# make the box adopt it.
#
# WHAT THIS REPLACES
# Nothing — there was no automated path to production at all. Merging to `main`
# ran tests and stopped; every production image was built by hand on a laptop
# and pushed with a person's AWS credentials. So the running artifact had no
# provenance and no link to a commit.
#
# THE CHAIN
#   caller triggers (workflow_dispatch today; never auto, see the docs)
#     -> resolve the box (instance_id override, else tag lookup, exactly one)
#     -> build linux/arm64, push ONLY <registry>/<prefix>/<service>:<full git SHA>
#     -> ssm send-command, under flock /run/lock/storytime-deploy.lock:
#          pull by digest, [prisma migrate deploy from the NEW image],
#          `redeploy.sh <service> <sha>` (this service only),
#          health gate (healthy + stable + right digest [+ smoke URL]),
#          automatic rollback to the previous image on any failure
#     -> POLL that command to a terminal state; fail the job if it failed
#     -> only then move <service>:latest to the proven digest
#
# The verification is the point. A fire-and-forget SendCommand returns a
# CommandId immediately and the job goes green whether or not the box ever
# pulled the image, let alone whether the image works. And `:latest` is promoted
# LAST, so a bad image can never become the tag that a reboot or another
# service's deploy would pick up.
#
# BACKWARD COMPATIBILITY. Every input and secret an existing caller passes still
# works, every new input is optional, and `instance_id` is still honoured. What
# changes for an existing caller once it re-pins to this version: the deploy now
# touches only its own service, gates on health, rolls back on failure, and moves
# `:latest` after success instead of at build time. See docs/build-and-deploy.md.
#
# WHY arm64, AND WHY THE DEFAULT RUNNER IS NOT ubuntu-latest
# The host is a Graviton instance (t4g), so the AMI is arm64 and an amd64 image
# does not execute at all — it dies with `exec format error`.
#
# `ubuntu-latest` is amd64, so building there means every instruction runs under
# QEMU user-mode emulation. That is a brutal tax on THIS image specifically: two
# full `pnpm install`s, two `prisma generate`s, an apt install of
# build-essential, a nest build and a Python venv, all CPU-bound.
#
# So the default runner is `ubuntu-24.04-arm` — NATIVE arm64, no emulation.
# Verified on 2026-09-16 by running a probe job in this repo: it reports
# aarch64, 4 CPU, 16 GB, docker server arch arm64, and it scheduled instantly.
# GitHub's own runner table lists `ubuntu-24.04-arm` under "Standard runners for
# public repositories", where use is "free and unlimited"; Bolt-Silverfox is on
# the free plan and both this repo and storytime_be are public, so it costs
# nothing. See docs/build-and-deploy.md for the measured comparison.
#
# The emulated path is kept working rather than deleted: set `runner` to
# `ubuntu-latest` and the QEMU step switches itself on. That matters if any of
# these repos is ever made PRIVATE, because arm64 runners are not free there.
#
# BLAST RADIUS
# Deploys are now scoped to the one service: `redeploy.sh <service> <sha>`
# restarts only that service's containers. The box-wide
# `storytime-reconcile.service` (redeploy.sh with NO arguments, which restarts
# EVERY container onto whatever its tag currently points at) is no longer used
# by this workflow; it still runs at boot, and that is exactly why `:latest`
# must only ever point at an image that has passed the health gate.
#
# Called from each app repo. The caller snippet is in
# docs/build-and-deploy.md — it is deliberately NOT installed in any app repo
# by this change.
# ---------------------------------------------------------------------------
name: Build and deploy

on:
  workflow_call:
    inputs:
      service:
        description: 'Service key. Selects the ECR repository (storytime/<service>) and must match a key in Terraform''s var.services.'
        required: true
        type: string
      environment:
        description: >-
          Target stack label: dev | staging | blue | prod. This is an AUDIT
          LABEL only — it names the role session and the SSM command comment.
          It does NOT choose the target box (instance_id does) and it is NOT a
          GitHub deployment environment: a job-level `environment:` inside a
          reusable workflow resolves against THIS repo, not the caller, so it
          cannot gate a caller's deploy behind the caller's approvals.
        required: true
        type: string
      role_arn:
        description: 'This repo''s entry in the gha_deploy_pipeline_role_arns Terraform output (a map, repo name => role ARN). Must be a role in account 772316781095.'
        required: true
        type: string
      instance_id:
        description: >-
          OPTIONAL override: the EC2 instance to deploy to, e.g.
          i-0d904f863b0161bcc. When empty (the default for NEW callers) the
          instance is looked up by tag (Stack=storytime-prod,
          Name=storytime-prod-app, running) and the deploy fails unless exactly
          one matches; that lookup needs ec2:DescribeInstances on the role.
          Existing callers that pass it keep working unchanged. The role's SSM
          grant is tag-scoped, so an ID outside that stack fails with
          AccessDenied rather than deploying somewhere unexpected.
        required: false
        type: string
        default: ''
      aws_region:
        description: 'Region holding the ECR repository and the instance. MUST match the Terraform stack region — the role''s policy pins both ARNs to it.'
        required: false
        type: string
        default: eu-west-1
      dockerfile:
        description: 'Path to the Dockerfile, relative to the caller repo root.'
        required: false
        type: string
        default: Dockerfile
      build_context:
        description: 'Docker build context, relative to the caller repo root.'
        required: false
        type: string
        default: '.'
      build_args:
        description: >-
          Newline-separated KEY=VALUE pairs passed to the image build.

          REQUIRED for the Next.js services (web, admin, waitlist-web). Next
          inlines NEXT_PUBLIC_* into the JavaScript bundle at BUILD time, so
          they cannot be supplied as runtime env the way every other setting
          here is: an image built without them is wrong, not unconfigured, and
          waitlist-web's Dockerfile fails the build outright rather than
          shipping a broken bundle.

          PUBLIC VALUES ONLY. Build args are readable in `docker history` and
          in this workflow's logs. That is acceptable for NEXT_PUBLIC_* because
          those values are already served to every browser that loads the site
          — it is what the prefix means. Anything genuinely secret must not be
          passed here; it belongs in SSM and is read at runtime.
        required: false
        type: string
        default: ''
      ecr_repository_prefix:
        description: >-
          Namespace of the ECR repository: <prefix>/<service>. MUST match
          Terraform's var.ecr_repository_prefix, which is what the IAM policy
          builds its repository ARN from. A mismatch fails closed with
          AccessDenied on push rather than writing to the wrong place.
        required: false
        type: string
        default: storytime
      runner:
        description: >-
          Runner label. Defaults to the NATIVE arm64 runner, which is free and
          unlimited on public repositories. Set to `ubuntu-latest` to build
          under QEMU emulation instead — correct, but far slower on this image.
          The QEMU setup step enables itself automatically based on runner.arch.
        required: false
        type: string
        default: ubuntu-24.04-arm
      reconcile_timeout_seconds:
        description: >-
          FLOOR for how long to wait for the deploy command to reach a terminal
          state. The effective wait is the larger of this and the payload's own
          executionTimeout (5460s + 2 x health_timeout_seconds) plus 300s, so
          the box always reports a terminal status before this job stops
          watching. Kept for backward compatibility; the validator still
          enforces 2100..7200.
        required: false
        type: number
        default: 2400
      smoke_url:
        description: |
          OPTIONAL post-deploy check. A URL to GET once the reconcile has
          finished; the job fails if it does not answer with one of
          smoke_expect_status.

          This exists because a deploy can go green while the service is
          completely unusable. storytime_superadmin shipped for a week with
          NEXT_PUBLIC_API_URL missing the API's `/api/v1` global prefix: the
          container was healthy, the login page returned 200, and every single
          API call 404'd. Nothing noticed until someone tried to log in.

          So point this at a route that only answers correctly when the service
          is wired up — ideally an AUTHENTICATED one, where the meaningful pass
          is 401. A 401 proves the route exists and the base path is right; a
          404 proves it is not. An unauthenticated 200 page proves much less,
          because a misconfigured app still serves its own shell.

          Left empty, the step is skipped and the behaviour is unchanged.
        required: false
        type: string
        default: ''
      smoke_expect_status:
        description: |
          Comma-separated HTTP statuses that count as a pass for smoke_url.
          Default covers the useful cases: 200/204 for a public endpoint,
          401/403 for an authenticated one reached without credentials.

          404 is deliberately NOT in the default, and is the whole point: it is
          the signature of a wrong base path or a route that never registered.
        required: false
        type: string
        default: '200,204,401,403'
      dry_run:
        description: >-
          Do everything EXCEPT replace containers and move :latest. The image
          is still built and pushed under its immutable <sha> tag, pulled on the
          box and checked against the pushed digest, and (with run_migrations)
          `prisma migrate status` is run instead of `migrate deploy`.
        required: false
        type: boolean
        default: false
      run_migrations:
        description: >-
          api only. Before the swap, run `prisma migrate deploy` from the NEW
          image in a one-off container on the app network, with the running
          api's environment. A non-zero exit aborts the deploy before any
          container is replaced. Migrations are NOT rolled back if the health
          gate later fails: write them expand/contract (see the docs). Default
          false preserves today's behaviour (migrations stay a manual step).
        required: false
        type: boolean
        default: false
      health_timeout_seconds:
        description: 'How long the new container has to become healthy AND stable (also used for the post-rollback wait). 60..900.'
        required: false
        type: number
        default: 300
      health_stable_samples:
        description: 'Consecutive healthy samples (10s apart) required before the deploy counts as healthy. 2..30.'
        required: false
        type: number
        default: 6
      gate_smoke_url:
        description: >-
          OPTIONAL. An https URL curled ON THE BOX through the local reverse
          proxy (resolved to 127.0.0.1, so real vhost routing and TLS) as part
          of the health gate. A failure triggers the automatic rollback. This
          is different from smoke_url, which is checked from the runner AFTER
          the deploy and cannot roll anything back.
        required: false
        type: string
        default: ''
      gate_smoke_expect_status:
        description: 'Comma-separated HTTP statuses that pass gate_smoke_url. For an authenticated route (e.g. admin) 401 is the meaningful pass.'
        required: false
        type: string
        default: '200,204,401,403'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      # Every input that reaches a SHELL, an ECR repository name, an IAM role
      # session name or an SSM target is checked here, once, rather than
      # trusting each future caller to pass something sane. Values arrive via
      # `env:` and are quoted in the test, so a hostile value cannot break out
      # of the condition.
      #
      # Two inputs are deliberately NOT covered, and it is worth being precise
      # about why rather than implying blanket coverage:
      #   * `runner` is consumed by `runs-on`, which is evaluated when the job
      #     is scheduled — before any step, including this one, can run. It
      #     cannot be validated here at all. An invalid label fails the job at
      #     allocation with a clear error, and it never reaches a shell.
      #   * `dockerfile` / `build_context` are passed to build-push-action as
      #     action inputs, not interpolated into a shell. They are still
      #     sanity-checked below to keep a path-traversal or newline-injection
      #     attempt from reaching the builder.
      - name: Validate inputs
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          ROLE_ARN: ${{ inputs.role_arn }}
          INSTANCE_ID: ${{ inputs.instance_id }}
          AWS_REGION_IN: ${{ inputs.aws_region }}
          RECONCILE_TIMEOUT: ${{ inputs.reconcile_timeout_seconds }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          DRY_RUN: ${{ inputs.dry_run }}
          HEALTH_TIMEOUT: ${{ inputs.health_timeout_seconds }}
          STABLE_SAMPLES: ${{ inputs.health_stable_samples }}
          GATE_SMOKE_URL: ${{ inputs.gate_smoke_url }}
          GATE_SMOKE_EXPECT: ${{ inputs.gate_smoke_expect_status }}
          ECR_PREFIX: ${{ inputs.ecr_repository_prefix }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] \
            || { echo "::error::service must be lowercase alphanumeric/dash"; exit 1; }
          # The Next.js services inline NEXT_PUBLIC_* at BUILD time, so an
          # image built without them is WRONG rather than unconfigured. admin
          # and waitlist-web fail their own builds when the values are absent;
          # web does not — it falls back to a default API origin and produces a
          # bundle that looks healthy and 404s every request once a user hits
          # one. That silent case is why this is checked here rather than left
          # to each Dockerfile.
          #
          # The list is hard-coded deliberately. Deriving it from a caller
          # input would let the caller most likely to get this wrong opt out of
          # the check. Adding a Next.js service means adding it here.
          #
          # Non-emptiness is not the contract. `build_args: FOO=bar` is
          # non-empty and still produces a misconfigured bundle, so the check
          # is for the values that actually matter.
          #
          # Duplicates first, for every service: Buildx keeps the LAST
          # assignment of a repeated key, so `NEXT_PUBLIC_API_URL=https://x`
          # followed by `NEXT_PUBLIC_API_URL=` would satisfy a per-line check
          # and still build against the empty value. Rejecting the repeat is
          # better than validating the winner -- a key assigned twice is a
          # caller bug whichever way it resolves, and this way the error names
          # the real mistake.
          if [ -n "${BUILD_ARGS//[[:space:]]/}" ]; then
            # `|| true` IS LOAD-BEARING, not defensive habit. grep exits 1 when
            # nothing matches; under `set -o pipefail` that becomes the
            # pipeline's status, and `set -e` then kills the step HERE --
            # before any of the checks below can print their message. The
            # inputs that match no assignment line are exactly the ones the
            # errors below are written for (`FOO`, `# comment`, `SOME-KEY=1`),
            # so without this the caller gets "exit code 1" and no annotation.
            # It was also a false failure for the API services, which have no
            # build-arg contract at all.
            BUILD_ARG_KEYS=$(
              grep -oE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=' <<<"$BUILD_ARGS" \
                | sed -E 's/^[[:space:]]*//; s/=$//' || true
            )

            # EVERY non-blank line must be an assignment, checked BEFORE
            # the keys are extracted. The extraction regex only recognises
            # identifier-shaped keys, so anything else is invisible to it --
            # and invisible to the allowlist below, which works off the
            # extracted keys. `BAD-KEY=x` alongside a legitimate assignment
            # therefore passed every check and still reached Buildx as
            # `--build-arg BAD-KEY=x`.
            #
            # Same bypass, worse case: a BARE key. Buildx reads `FOO` as
            # inherit-from-environment, and the action passes no csv comment
            # option, so `# a note` becomes a literal build arg named `#`.
            # Neither extracts a key, so `BUILDKIT_SYNTAX` written bare would
            # slip past the allowlist that exists to reject it by name --
            # harmless today only because the runner's environment does not
            # define it, which is not something checked here.
            #
            # Validating the LINES rather than the extracted keys closes both,
            # and makes the later checks able to assume a well-formed list.
            MALFORMED_LINES=$(
              grep -nvE '^[[:space:]]*$|^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=' <<<"$BUILD_ARGS" \
                | tr '\n' ';' || true
            )
            [ -z "$MALFORMED_LINES" ] || {
              echo "::error::build_args must be newline-separated KEY=VALUE pairs; malformed line(s): ${MALFORMED_LINES}(a key must be a shell identifier, and a bare key -- inherit-from-environment to Buildx -- is not supported)"
              exit 1
            }

            DUPLICATE_KEYS=$(sort <<<"$BUILD_ARG_KEYS" | uniq -d | tr '\n' ' ')
            [ -z "${DUPLICATE_KEYS// /}" ] || {
              echo "::error::build_args assigns the same key more than once: ${DUPLICATE_KEYS}(Buildx keeps the last assignment, so an earlier value is silently discarded)"
              exit 1
            }

            # ALLOWLIST, not a denylist. BuildKit reads several build args as
            # control knobs rather than application config, and this pipeline
            # holds ECR push credentials while it builds: BUILDKIT_SYNTAX
            # replaces the Dockerfile frontend with an arbitrary image (code
            # execution inside a build that can push to ECR and write the
            # shared cache), http_proxy/https_proxy route every fetch in the
            # build through a chosen host, and BUILDKIT_CACHE_MOUNT_NS can
            # collide with another service's cache. Callers need repo write,
            # so this is defence in depth -- but the role_arn account pinning
            # above is written to exactly that standard, and leaving the key
            # space open is inconsistent with it.
            #
            # It also makes "PUBLIC VALUES ONLY" real rather than advisory:
            # the runner echoes the full build command, so a SECRET_TOKEN=...
            # passed here would sit unmasked in a log any repo reader can see,
            # and in the image config in ECR.
            #
            # NEXT_PUBLIC_* covers every ARG the three Next.js Dockerfiles
            # declare. NODE_VERSION/PNPM_VERSION/ALPINE_VERSION are the
            # toolchain pins the Dockerfiles also declare; they are harmless to
            # set and occasionally useful. Add to this list deliberately.
            DISALLOWED_KEYS=$(
              grep -vE '^(NEXT_PUBLIC_[A-Za-z0-9_]+|NODE_VERSION|PNPM_VERSION|ALPINE_VERSION)$' \
                <<<"$BUILD_ARG_KEYS" | grep -v '^$' | tr '\n' ' ' || true
            )
            [ -z "${DISALLOWED_KEYS// /}" ] || {
              echo "::error::build_args contains keys that are not allowed: ${DISALLOWED_KEYS}(only NEXT_PUBLIC_*, NODE_VERSION, PNPM_VERSION and ALPINE_VERSION may be set; build args are echoed in logs and recorded in the image, and BuildKit treats some keys as build controls)"
              exit 1
            }
          fi

          case "$SERVICE" in
            web|admin|waitlist-web)
              [ -n "${BUILD_ARGS//[[:space:]]/}" ] || {
                echo "::error::$SERVICE needs build_args (NEXT_PUBLIC_* are inlined at build time; an image built without them is misconfigured, not unconfigured)"
                exit 1
              }
              grep -qE '^[[:space:]]*NEXT_PUBLIC_[A-Z0-9_]+=' <<<"$BUILD_ARGS" || {
                echo "::error::$SERVICE build_args contains no NEXT_PUBLIC_* assignment; those are what Next inlines at build time"
                exit 1
              }
              # web is singled out because it is the only one that fails
              # QUIETLY. admin and waitlist-web abort their own builds when
              # their values are missing; web falls back to a default API
              # origin and ships a bundle that looks healthy and 404s every
              # request. Naming the key couples this workflow to the app, which
              # is the price of catching the silent case here rather than in
              # production.
              if [ "$SERVICE" = web ]; then
                grep -qE '^[[:space:]]*NEXT_PUBLIC_API_URL=[^[:space:]]' <<<"$BUILD_ARGS" || {
                  echo "::error::web build_args must set NEXT_PUBLIC_API_URL; without it the bundle silently falls back to a default API origin"
                  exit 1
                }
              fi
              ;;
          esac
          case "$ENVIRONMENT" in
            dev|staging|blue|prod) ;;
            *) echo "::error::environment must be one of dev staging blue prod"; exit 1 ;;
          esac
          # Pin the account. role_arn is caller-supplied, and a typo pointing at
          # a role in another account would push this image into that account's
          # registry and report success.
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::772316781095:role/[A-Za-z0-9+=,.@_-]{1,64}$ ]] \
            || { echo "::error::role_arn must be a role in account 772316781095"; exit 1; }
          # Empty is valid: the instance is then looked up by tag.
          if [ -n "$INSTANCE_ID" ]; then
            [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,32}$ ]] \
              || { echo "::error::instance_id must look like i-0123456789abcdef0 (or be empty)"; exit 1; }
          fi
          # Rail inputs. Everything below reaches a root shell on the box via
          # the SSM payload, so each is pinned to a narrow shape here.
          if [ "$RUN_MIGRATIONS" = true ] && [ "$SERVICE" != api ]; then
            echo "::error::run_migrations is only supported for service=api (it runs prisma)"
            exit 1
          fi
          if ! [[ "$HEALTH_TIMEOUT" =~ ^[0-9]{2,3}$ ]] \
             || [ "$HEALTH_TIMEOUT" -lt 60 ] || [ "$HEALTH_TIMEOUT" -gt 900 ]; then
            echo "::error::health_timeout_seconds must be an integer in 60..900"
            exit 1
          fi
          if ! [[ "$STABLE_SAMPLES" =~ ^[0-9]{1,2}$ ]] \
             || [ "$STABLE_SAMPLES" -lt 2 ] || [ "$STABLE_SAMPLES" -gt 30 ]; then
            echo "::error::health_stable_samples must be an integer in 2..30"
            exit 1
          fi
          if [ -n "$GATE_SMOKE_URL" ]; then
            [[ "$GATE_SMOKE_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~%/?=\&+,-]*)?$ ]] \
              || { echo "::error::gate_smoke_url must be a plain https URL (no port, userinfo or quotes)"; exit 1; }
          fi
          [[ "$GATE_SMOKE_EXPECT" =~ ^[0-9]{3}(,[0-9]{3})*$ ]] \
            || { echo "::error::gate_smoke_expect_status must be comma-separated HTTP codes"; exit 1; }
          [[ "$AWS_REGION_IN" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] \
            || { echo "::error::aws_region is not a region name"; exit 1; }
          # Bounds are not cosmetic. Below the payload's executionTimeout
          # (1900s) the job stops watching while the box is still working and
          # reports a timeout on a deploy that then succeeds; above
          # timeout-minutes (7200s) the value is unreachable.
          # Written as an explicit `if` rather than `A && B || { ... }`.
          # SC2015 is right that the latter is not if-then-else, and chaining
          # three tests into one `||` makes the reader verify that by hand.
          # (A comment line here must not START with the word shellcheck --
          # that prefix is parsed as a lint directive and fails the parse.)
          if ! [[ "$RECONCILE_TIMEOUT" =~ ^[0-9]{4}$ ]] \
             || [ "$RECONCILE_TIMEOUT" -lt 2100 ] \
             || [ "$RECONCILE_TIMEOUT" -gt 7200 ]; then
            echo "::error::reconcile_timeout_seconds must be an integer in 2100..7200"
            exit 1
          fi
          [[ "$ECR_PREFIX" =~ ^[a-z0-9][a-z0-9._/-]{0,39}$ ]] \
            || { echo "::error::ecr_repository_prefix must be a lowercase ECR namespace"; exit 1; }
          # No newlines, no '..', no leading '/' — a relative path inside the
          # checkout and nothing else.
          for p in "$DOCKERFILE" "$BUILD_CONTEXT"; do
            [[ "$p" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] \
              || { echo "::error::dockerfile/build_context must be a simple relative path"; exit 1; }
            case "$p" in
              /*|*..*) echo "::error::dockerfile/build_context must not be absolute or contain '..'"; exit 1 ;;
            esac
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # binfmt_misc handlers so an amd64 runner can execute arm64 binaries.
      # Without this, `--platform linux/arm64` on an amd64 runner fails the
      # moment the build reaches its first RUN instruction.
      #
      # Skipped entirely on a native arm64 runner — registering an emulator for
      # the architecture you already are is pure overhead. Gated on runner.arch
      # rather than on the label string so a self-hosted arm64 runner (whose
      # label will not end in `-arm`) is also handled correctly. runner.arch is
      # one of X86, X64, ARM, ARM64.
      - name: Set up QEMU (emulated builds only)
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ inputs.role_arn }}
          role-session-name: deploy-${{ inputs.service }}-${{ inputs.environment }}
          aws-region: ${{ inputs.aws_region }}
          # MUST be requested explicitly. This action defaults to 1 hour and
          # never refreshes, so the role's 2-hour max_session_duration is inert
          # without this line — and an emulated fallback build (measured at 40
          # minutes on hardware faster than a hosted runner) can reach the
          # reconcile step with expired credentials. Keep in step with
          # max_session_duration in infra/github-oidc-deploy.tf; requesting
          # more than the role allows fails the assume-role outright.
          role-duration-seconds: 7200

      # Which box? Resolved BEFORE the build so a mis-scoped role fails in
      # seconds, not after a 10-minute image build.
      #
      # `instance_id` still wins when given. Otherwise the instance is looked up
      # by the same two tags the role's SSM grant matches on (Stack and Name),
      # restricted to RUNNING instances, and the deploy proceeds only if EXACTLY
      # ONE matches: zero means the box is down or retagged, and more than one
      # means the lookup is ambiguous -- in both cases guessing is worse than
      # stopping. Instance IDs change whenever compute.tf replaces the box, which
      # is why a hard-coded ID in five caller repos is a trap.
      #
      # This needs ec2:DescribeInstances, which the deploy role does NOT have
      # until infra/github-oidc-deploy.tf is applied with the matching change.
      # Until then the lookup fails with an explicit message and callers keep
      # passing instance_id, exactly as before.
      #
      # Only `prod` is defined: the tag values below are the production stack's.
      - name: Resolve target instance
        id: instance
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          ENVIRONMENT: ${{ inputs.environment }}
          INSTANCE_ID_IN: ${{ inputs.instance_id }}
        run: |
          set -euo pipefail
          if [ -n "$INSTANCE_ID_IN" ]; then
            echo "using the instance_id supplied by the caller: ${INSTANCE_ID_IN}"
            echo "id=${INSTANCE_ID_IN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ENVIRONMENT" != prod ]; then
            echo "::error::automatic instance lookup is only defined for environment=prod; pass instance_id for ${ENVIRONMENT}"
            exit 1
          fi

          err=$(mktemp)
          if ! found=$(aws ec2 describe-instances --region "$AWS_REGION" \
                --filters "Name=tag:Stack,Values=storytime-prod" \
                          "Name=tag:Name,Values=storytime-prod-app" \
                          "Name=instance-state-name,Values=running" \
                --query 'Reservations[].Instances[].InstanceId' --output text 2>"$err"); then
            if grep -qE 'UnauthorizedOperation|AccessDenied' "$err"; then
              echo "::error::this role may not call ec2:DescribeInstances, so the instance cannot be looked up. Either pass the instance_id input (as before), or apply the infra/github-oidc-deploy.tf change that grants ec2:DescribeInstances to the deploy roles."
            else
              echo "::error::ec2 describe-instances failed:"
              cat "$err" >&2
            fi
            exit 1
          fi

          # shellcheck disable=SC2206
          ids=($found)
          if [ "${#ids[@]}" -ne 1 ]; then
            echo "::error::expected exactly one running instance tagged Stack=storytime-prod Name=storytime-prod-app, found ${#ids[@]} (${found:-none}). Refusing to guess; pass instance_id to override."
            exit 1
          fi
          [[ "${ids[0]}" =~ ^i-[0-9a-f]{8,32}$ ]] \
            || { echo "::error::lookup returned something that is not an instance id"; exit 1; }
          echo "resolved storytime-prod-app -> ${ids[0]}"
          echo "id=${ids[0]}" >> "$GITHUB_OUTPUT"

      # Deliberately the AWS CLI rather than aws-actions/amazon-ecr-login. The
      # CLI is preinstalled on the runner and the call is two lines, so pulling
      # in another third-party action would add supply-chain surface for no
      # capability. The password reaches `docker login` on stdin, never argv,
      # so it is not visible in `ps` on the runner.
      - name: Log in to ECR
        id: ecr
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

      # Only the IMMUTABLE <full git sha> tag is pushed here. `:latest` is NOT
      # touched until the deploy below has proven the image healthy on the box
      # (the "Promote latest" step). Pushing `:latest` at build time meant a bad
      # image became the tag that a reboot, the reconcile unit, and every OTHER
      # service's deploy would pick up -- redeploy.sh with no argument re-pulls
      # whatever each tag currently points at.
      #
      # The SHA tag is the record of "which commit is in production", and what
      # the deploy pulls and verifies against.
      #
      # To ROLL BACK, do NOT set services.<name>.image_tag to a SHA and apply:
      # image_tag is interpolated into user-data and compute.tf sets
      # user_data_replace_on_change = true, so that REPLACES the instance (and
      # its new instance ID then breaks this very deploy role). A failed deploy
      # rolls itself back; for a manual rollback see docs/build-and-deploy.md.
      #
      # Cache: the GitHub Actions cache backend. On an emulated arm64 build the
      # apt/pnpm layers dominate, so a warm cache is the difference between a
      # tolerable pipeline and an unusable one. `ignore-error=true` is a
      # buildkit cache-export attribute (moby/buildkit control.go) that
      # downgrades an export failure to a warning -- a full or evicted cache must
      # not fail a deploy that has already built successfully.
      - name: Build and push linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          # Empty string is fine: the action treats a blank build-args as none,
          # so services that need no build-time configuration are unaffected.
          build-args: ${{ inputs.build_args }}
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository_prefix }}/${{ inputs.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-arm64,ignore-error=true

      # The digest of what was just pushed, taken from the build step's own
      # output rather than read back from ECR.
      #
      # An earlier draft called `aws ecr batch-get-image` to resolve the tag.
      # That is a latent fail-closed trap: BatchGetImage's documented
      # acceptedMediaTypes are the two Docker manifest types and
      # application/vnd.oci.image.manifest.v1+json — there is NO index /
      # manifest-list type in the list. Today buildx emits a plain manifest
      # (single platform, provenance off) so it would work, but re-enabling
      # provenance or adding a second platform would make it emit an index and
      # every deploy would start failing on a step that has nothing to do with
      # the change. The build output has no such coupling, costs no API call,
      # and needs no extra IAM.
      #
      # The equivalence this relies on was TESTED, not assumed: pushing a
      # single-platform linux/arm64 image with buildx and pulling it back
      # yields a `docker image inspect -f '{{join .RepoDigests ","}}'` value
      # containing exactly the digest the registry reports for that tag.
      # Checked with provenance both disabled and enabled — it matches either
      # way, because a pull by tag records the digest of whatever manifest the
      # tag resolves to.
      - name: Check the pushed digest
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build step did not report a usable image digest (got '${BUILD_DIGEST}')"; exit 1; }
          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed digest ${BUILD_DIGEST}"

      # Deploy ONE service onto the box, gate it on health, and roll back by
      # itself if it does not hold.
      #
      # WHAT RUNS ON THE BOX (the REMOTE heredoc below), in order, all under
      # `flock /run/lock/storytime-deploy.lock` so deploys from different repos
      # queue instead of racing:
      #
      #   1. probe  -- redeploy.sh must support `<service> <tag>`; pull the new
      #                image BY DIGEST and confirm the :<sha> tag resolves to the
      #                same digest the build reported; record the container's
      #                current image ref in /var/lib/storytime/deployed/<service>.
      #   2. migrate-- (api only, run_migrations) a ONE-OFF container from the NEW
      #                image on the `storytime` network, env derived from the
      #                running api container. Non-zero exit ABORTS here, before
      #                any container is replaced. dry_run runs `migrate status`.
      #   3. swap   -- `redeploy.sh <service> <sha>`: this service only.
      #   4. gate   -- bounded wait for healthy AND stable (running, not
      #                restarting, RestartCount unchanged, on the pushed digest)
      #                for N consecutive samples, then the optional smoke URL
      #                through the local proxy.
      #   5. on ANY failure after the swap: `redeploy.sh <service> <previous>`,
      #                wait for healthy again, and exit non-zero.
      #
      # EXIT CODES from the box, which the poll below turns into annotations:
      #   0 deployed and healthy      1 failed, ROLLED BACK (previous is serving)
      #   2 failed and NOT restored   3 aborted before anything was replaced
      #   75 could not get the deploy lock within the wait (nothing changed)
      #
      # This is NOT a zero-downtime deploy: redeploy.sh does `docker rm -f`
      # then `docker run`, so the service is down for the few seconds between.
      # What the rails buy is that a BAD image cannot stay live, and cannot
      # spread to other services.
      #
      # WHY STILL ASSERT THE DIGEST. A container can be Up and healthy on the
      # wrong image (a swap that quietly did nothing). The gate therefore also
      # requires every container of the service to be on EXPECT_DIGEST.
      #
      # The gate's loop is bounded by ITERATIONS (health_timeout / interval),
      # not by wall-clock, so it terminates even under a stubbed `sleep`.
      #
      # POSIX sh only (no `pipefail`, no `[[ ]]`, no arrays). AWS-RunShellScript
      # executes the payload with /bin/sh; that is bash on this AL2023 AMI, but
      # writing to sh keeps it correct if the AMI family ever changes.
      #
      # The STORYTIME_* defaults in the payload are TEST SEAMS for
      # tests/deploy/run-tests.sh. SSM runs with a clean environment, so on the
      # box they always take the production values.
      #
      # `aws ssm wait command-executed` is not used: its waiter caps at 20
      # attempts x 5s = 100 seconds, so it would report failure on a deploy that
      # was merely still running.
      - name: Deploy on the instance
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_SHA: ${{ github.sha }}
          REPO_URI: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repository_prefix }}/${{ inputs.service }}
          EXPECT_DIGEST: ${{ steps.digest.outputs.digest }}
          POLL_TIMEOUT: ${{ inputs.reconcile_timeout_seconds }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          DRY_RUN: ${{ inputs.dry_run }}
          HEALTH_TIMEOUT: ${{ inputs.health_timeout_seconds }}
          STABLE_SAMPLES: ${{ inputs.health_stable_samples }}
          GATE_SMOKE_URL: ${{ inputs.gate_smoke_url }}
          GATE_SMOKE_EXPECT: ${{ inputs.gate_smoke_expect_status }}
        run: |
          set -euo pipefail

          # The remote payload, written to a file so it can be handed to jq
          # verbatim. Quoted heredoc: nothing here is expanded by THIS shell.
          cat > /tmp/deploy-body.sh <<'REMOTE'
          # Runs on the box as root, under the deploy lock. See the step header.
          REDEPLOY="${STORYTIME_REDEPLOY:-/usr/local/bin/redeploy.sh}"
          STATE_DIR="${STORYTIME_STATE_DIR:-/var/lib/storytime/deployed}"
          ENV_ROOT="${STORYTIME_ENV_ROOT:-/run/storytime-deploy}"
          NETWORK="${STORYTIME_NETWORK:-storytime}"
          GATE_INTERVAL="${STORYTIME_GATE_INTERVAL:-10}"
          REGISTRY="${REPO%%/*}"

          log() { printf '%s\n' "$*"; }
          abort() { log "ABORTED before any container was replaced: $*"; exit 3; }

          umask 077
          mkdir -p "$ENV_ROOT" "$STATE_DIR"
          chmod 755 "$STATE_DIR"
          WORK=$(mktemp -d "$ENV_ROOT/work.XXXXXX") || abort "cannot create a scratch directory"
          cleanup() { rm -rf "$WORK"; }
          trap cleanup EXIT
          trap 'exit 143' INT TERM

          PREV_REF=""; PREV_ID=""; PREV_DIGEST=""; PREV_TAG=""; HAVE_PREV=0

          write_state() { # result
            t="$STATE_DIR/.$SERVICE.$$"
            {
              echo "service=$SERVICE"
              echo "target=$REPO:$TAG"
              echo "target_digest=$DIGEST"
              echo "previous=$PREV_REF"
              echo "previous_image_id=$PREV_ID"
              echo "previous_digest=$PREV_DIGEST"
              echo "updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "result=$1"
            } > "$t" && chmod 644 "$t" && mv -f "$t" "$STATE_DIR/$SERVICE"
          }

          # WHICH containers should this service have, by name? Read straight out
          # of the box's own redeploy.sh, which Terraform generates with one
          # `run_service "<service>" "<container>" ...` line per container
          # (replicas included). One source, written by the same apply that
          # created the containers; no second place to keep in step.
          names=$(sed -n "s/^[[:space:]]*run_service \"$SERVICE\" \"\([^\"]*\)\".*/\1/p" \
                    "$REDEPLOY" || true)
          [ -n "$names" ] || abort "no run_service line for $SERVICE in $REDEPLOY -- it is not deployed on this host"
          log "service $SERVICE -> container(s): $(printf '%s ' $names)"

          # The single-service form must exist on THIS box. An older redeploy.sh
          # without it would ignore the tag and restart everything.
          grep -q 'TAG_OVERRIDE' "$REDEPLOY" \
            || abort "$REDEPLOY does not support '<service> <tag>' (no TAG_OVERRIDE); refusing to guess"

          # ---- 1. probe: pull by digest, confirm the tag agrees --------------
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null 2>&1 \
            || abort "ECR login failed"
          timeout 600 docker pull "$REPO@$DIGEST" > "$WORK/pull.log" 2>&1 \
            || { tail -n 5 "$WORK/pull.log"; abort "cannot pull $REPO@$DIGEST"; }
          timeout 600 docker pull "$REPO:$TAG" > "$WORK/pull.log" 2>&1 \
            || { tail -n 5 "$WORK/pull.log"; abort "cannot pull $REPO:$TAG"; }
          tag_digests=$(docker image inspect "$REPO:$TAG" -f '{{join .RepoDigests ","}}' 2>/dev/null) \
            || abort "cannot inspect $REPO:$TAG"
          case ",$tag_digests," in
            *"@$DIGEST,"*) ;;
            *) abort "$REPO:$TAG resolves to [$tag_digests], not the pushed digest $DIGEST" ;;
          esac
          log "pulled $REPO@$DIGEST (tag $TAG agrees)"

          # What is running now = what rollback restores. Recorded BEFORE anything
          # changes.
          mixed=0
          for c in $names; do
            if info=$(docker inspect -f '{{.Config.Image}} {{.Image}}' "$c" 2>/dev/null); then
              # shellcheck disable=SC2086
              set -- $info
              if [ -z "$PREV_REF" ]; then PREV_REF=$1; PREV_ID=$2; fi
              [ "$1" = "$PREV_REF" ] || mixed=1
            fi
          done
          if [ -n "$PREV_REF" ]; then
            [ "$mixed" = 0 ] || abort "replicas of $SERVICE run different images; reconcile them before deploying"
            case "$PREV_REF" in
              *@*) abort "running image $PREV_REF is digest-pinned; cannot roll back to it with 'redeploy.sh <service> <tag>'" ;;
            esac
            PREV_TAG=${PREV_REF##*:}
            [ "${PREV_REF%:*}" = "$REPO" ] \
              || abort "running image $PREV_REF is not in $REPO; refusing to deploy over it"
            old_digests=$(docker image inspect "$PREV_ID" -f '{{join .RepoDigests ","}}' 2>/dev/null || true)
            oldIFS=$IFS; IFS=,
            for d in $old_digests; do
              case "$d" in "$REPO@"*) PREV_DIGEST=${d#*@} ;; esac
            done
            IFS=$oldIFS
            HAVE_PREV=1
            log "currently running: $PREV_REF (${PREV_DIGEST:-digest unknown})"
          else
            log "WARNING: no running container for $SERVICE; a failed deploy cannot be rolled back"
          fi

          # ---- 2. migrations --------------------------------------------------
          # Masks every env VALUE (and the userinfo of URLs) in prisma's output,
          # so nothing from the running api's environment can reach the job log.
          mask() {
            python3 -c 'import re, sys
          vals = []
          for line in open(sys.argv[1]):
              v = line.rstrip("\n").partition("=")[2]
              if len(v) >= 4:
                  vals.append(v)
                  for m in re.finditer(r"://([^/@]*)@", v):
                      vals.append(m.group(1))
                      vals.extend(p for p in m.group(1).split(":") if len(p) >= 4)
          vals.sort(key=len, reverse=True)
          s = sys.stdin.read()
          for v in vals:
              s = s.replace(v, "***")
          sys.stdout.write(s)' "$WORK/envfile"
          }

          # prisma runs from the NEW image (the old one lacks the new migrations,
          # so `docker exec` on it would be wrong), on the app network, with the
          # running api's own environment minus what the old image bakes in.
          prisma() { # prisma subcommand words...
            timeout 600 docker run --rm --network "$NETWORK" --env-file "$WORK/envfile" \
              "$REPO@$DIGEST" node_modules/.bin/prisma "$@" > "$WORK/prisma.log" 2>&1
            prc=$?
            if command -v python3 >/dev/null 2>&1; then
              tail -n 40 "$WORK/prisma.log" | mask || log "(output suppressed: masking failed)"
            else
              log "(prisma output suppressed: python3 is needed to mask it)"
            fi
            return "$prc"
          }

          if [ "$RUN_MIGRATIONS" = true ]; then
            [ "$HAVE_PREV" = 1 ] || abort "migrations need a running $SERVICE container to read its environment from"
            src=$(printf '%s\n' "$names" | head -n 1)
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$src" > "$WORK/cenv" 2>/dev/null \
              || abort "cannot read the environment of $src"
            docker image inspect "$PREV_ID" -f '{{range .Config.Env}}{{println .}}{{end}}' > "$WORK/ienv" 2>/dev/null \
              || : > "$WORK/ienv"
            grep -vxFf "$WORK/ienv" "$WORK/cenv" | grep -v '^$' > "$WORK/envfile" || true
            chmod 600 "$WORK/envfile"
            [ -s "$WORK/envfile" ] || abort "the running $SERVICE container has no environment to hand to prisma"

            if [ "$DRY_RUN" = true ]; then
              log "DRY RUN: prisma migrate status (read-only)"
              mrc=0
              prisma migrate status || mrc=$?
              log "migrate status exited $mrc (non-zero is normal when migrations are pending)"
            else
              log "running prisma migrate deploy from the new image"
              mrc=0
              prisma migrate deploy || mrc=$?
              if [ "$mrc" -ne 0 ]; then
                abort "prisma migrate deploy exited $mrc. The OLD containers are still running and untouched. A migration that failed part-way may have applied earlier steps; inspect the database before retrying."
              fi
              log "migrations applied"
            fi
            rm -f "$WORK/envfile"
          fi

          if [ "$DRY_RUN" = true ]; then
            log "DRY RUN: would replace $SERVICE with $REPO:$TAG ($DIGEST); not touching any container, not promoting :latest"
            exit 0
          fi

          # ---- health gate ----------------------------------------------------
          gate() { # $1 = digest every container must be on ("" = unchecked)
            want=$1
            tries=$(( HEALTH_TIMEOUT / GATE_INTERVAL ))
            [ "$tries" -ge "$STABLE_SAMPLES" ] || tries=$STABLE_SAMPLES
            rm -f "$WORK"/rc.*
            stable=0; n=0
            while [ "$n" -lt "$tries" ]; do
              n=$((n + 1)); allok=1
              for c in $names; do
                if ! s=$(docker inspect -f '{{.State.Status}} {{.State.Restarting}} {{.RestartCount}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} {{.Image}}' "$c" 2>/dev/null); then
                  allok=0; log "  [$n] $c: does not exist"; continue
                fi
                # shellcheck disable=SC2086
                set -- $s
                st=$1; rs=$2; rcn=$3; hl=$4; im=$5
                [ -f "$WORK/rc.$c" ] || echo "$rcn" > "$WORK/rc.$c"
                problem=""
                [ "$st" = running ] || problem="state=$st"
                [ "$rs" = false ] || problem="restarting"
                if [ "$rcn" != "$(cat "$WORK/rc.$c")" ]; then
                  problem="restart count rose to $rcn"; echo "$rcn" > "$WORK/rc.$c"
                fi
                case "$hl" in healthy|none) ;; *) problem="health=$hl" ;; esac
                if [ -z "$problem" ] && [ -n "$want" ]; then
                  docker image inspect "$im" -f '{{join .RepoDigests ","}}' 2>/dev/null | grep -qF "@$want" \
                    || problem="not on image $want"
                fi
                if [ -n "$problem" ]; then allok=0; log "  [$n] $c: $problem"; fi
              done
              if [ "$allok" = 1 ]; then stable=$((stable + 1)); else stable=0; fi
              if [ "$stable" -ge "$STABLE_SAMPLES" ]; then
                log "  stable: $stable consecutive healthy samples"
                return 0
              fi
              sleep "$GATE_INTERVAL"
            done
            return 1
          }

          # The optional smoke URL, resolved to THIS box so it goes through the
          # local reverse proxy (real vhost routing and TLS), independent of DNS.
          gate_smoke() {
            [ -n "$GATE_URL" ] || return 0
            host=${GATE_URL#https://}; host=${host%%/*}
            i=0; code=000
            while [ "$i" -lt 6 ]; do
              i=$((i + 1))
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                       --resolve "$host:443:127.0.0.1" "$GATE_URL" || echo 000)
              case ",$GATE_EXPECT," in
                *",$code,"*) log "  smoke ok: $GATE_URL -> $code"; return 0 ;;
              esac
              log "  smoke attempt $i/6: $GATE_URL -> $code (want one of $GATE_EXPECT)"
              sleep 5
            done
            return 1
          }

          rollback() { # reason
            log "FAILURE: $1"
            if [ "$HAVE_PREV" != 1 ]; then
              log "ROLLBACK FAILED: no previous image was recorded, so there is nothing to restore"
              write_state rollback-failed; exit 2
            fi
            log "rolling back $SERVICE to $PREV_REF"
            rrc=0
            timeout 900 "$REDEPLOY" "$SERVICE" "$PREV_TAG" > "$WORK/rollback.log" 2>&1 || rrc=$?
            tail -n 15 "$WORK/rollback.log"
            if [ "$rrc" -eq 0 ] && gate "$PREV_DIGEST"; then
              log "ROLLED BACK: $SERVICE is serving $PREV_REF again. The failed image $REPO:$TAG was NOT promoted to :latest."
              write_state rolled-back; exit 1
            fi
            log "ROLLBACK FAILED: $SERVICE did not come back healthy on $PREV_REF (redeploy exit $rrc). Production may be down: use docs/build-and-deploy.md, 'Manual rollback'."
            write_state rollback-failed; exit 2
          }

          # ---- 3. swap --------------------------------------------------------
          write_state swapping
          log "swapping $SERVICE onto $REPO:$TAG"
          src_rc=0
          timeout 900 "$REDEPLOY" "$SERVICE" "$TAG" > "$WORK/redeploy.log" 2>&1 || src_rc=$?
          tail -n 15 "$WORK/redeploy.log"
          [ "$src_rc" -eq 0 ] || rollback "redeploy.sh exited $src_rc"

          # ---- 4. gate --------------------------------------------------------
          log "waiting up to ${HEALTH_TIMEOUT}s for $SERVICE to be healthy and stable (${STABLE_SAMPLES} samples)"
          gate "$DIGEST" || rollback "$SERVICE did not become healthy and stable on $DIGEST within ${HEALTH_TIMEOUT}s"
          gate_smoke || rollback "smoke URL $GATE_URL never answered one of $GATE_EXPECT"

          write_state ok
          # redeploy.sh ends with `docker image prune -af`, so the superseded
          # image is already gone from the box; rollback re-pulls it from ECR.
          log "DEPLOY OK: $SERVICE is on $REPO:$TAG ($DIGEST); previous was ${PREV_REF:-none}"
          exit 0
          REMOTE

          # Built with jq rather than string-interpolated into the shell: the
          # parameters are JSON, and hand-quoting JSON inside bash inside YAML
          # is how a stray character becomes a malformed API call. Variables go
          # through jq's `@sh`; a literal `'...'` inside this single-quoted jq
          # program would close bash's quoting, not jq's.
          #
          # The body is written to a temp file and run by `flock ... sh FILE`, so
          # the lock is held by the process that does the work and released when
          # it exits, however it exits. STORYTIME_DEPLOY_LOCK_HELD=1 is exported
          # so that a future redeploy.sh which takes the SAME lock can skip it
          # when called from here instead of deadlocking on its own parent.
          #
          # TIMEOUT LADDER. Every wait is bounded and the numbers have to admit
          # the worst case rather than merely look ordered:
          #   lock wait                    1800s  (flock -w)
          #   2 pulls                      2 x 600
          #   migrations                    600
          #   swap                          900
          #   gate (new)                    health_timeout_seconds
          #   smoke                          60
          #   rollback swap                 900
          #   gate (previous)               health_timeout_seconds
          #   => executionTimeout = 5460 + 2 x health_timeout_seconds
          # and the runner keeps watching for 300s longer than that, so the box
          # reports a terminal status before this job stops looking. The older
          # reconcile_timeout_seconds still applies as a FLOOR on that wait.
          exec_timeout=$(( 5460 + 2 * HEALTH_TIMEOUT ))
          poll_timeout=$(( exec_timeout + 300 ))
          if [ "$POLL_TIMEOUT" -gt "$poll_timeout" ]; then poll_timeout=$POLL_TIMEOUT; fi

          params=$(jq -nc \
            --arg svc "$SERVICE" \
            --arg repo "$REPO_URI" \
            --arg tag "$IMAGE_SHA" \
            --arg digest "$EXPECT_DIGEST" \
            --arg region "$AWS_REGION" \
            --arg mig "$RUN_MIGRATIONS" \
            --arg dry "$DRY_RUN" \
            --arg health "$HEALTH_TIMEOUT" \
            --arg stable "$STABLE_SAMPLES" \
            --arg gurl "$GATE_SMOKE_URL" \
            --arg gexp "$GATE_SMOKE_EXPECT" \
            --arg exec "$exec_timeout" \
            --rawfile body /tmp/deploy-body.sh \
            '{
              commands: [
                "set -eu",
                ("export SERVICE=" + ($svc | @sh)),
                ("export REPO=" + ($repo | @sh)),
                ("export TAG=" + ($tag | @sh)),
                ("export DIGEST=" + ($digest | @sh)),
                ("export AWS_REGION=" + ($region | @sh)),
                ("export RUN_MIGRATIONS=" + ($mig | @sh)),
                ("export DRY_RUN=" + ($dry | @sh)),
                ("export HEALTH_TIMEOUT=" + ($health | @sh)),
                ("export STABLE_SAMPLES=" + ($stable | @sh)),
                ("export GATE_URL=" + ($gurl | @sh)),
                ("export GATE_EXPECT=" + ($gexp | @sh)),
                "BODY_F=$(mktemp)",
                ("cat > \"$BODY_F\" <<'"'"'STORYTIME_DEPLOY_BODY'"'"'\n" + $body + "\nSTORYTIME_DEPLOY_BODY"),
                "rc=0",
                "flock -w \"${STORYTIME_LOCK_WAIT:-1800}\" -E 75 \"${STORYTIME_LOCK:-/run/lock/storytime-deploy.lock}\" env STORYTIME_DEPLOY_LOCK_HELD=1 sh \"$BODY_F\" || rc=$?",
                "rm -f \"$BODY_F\"",
                "exit $rc"
              ],
              executionTimeout: [$exec]
            }')

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SERVICE} ${ENVIRONMENT} ${IMAGE_SHA}" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $command_id"

          deadline=$(( SECONDS + poll_timeout ))
          status=""
          while true; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::deploy did not reach a terminal state within ${poll_timeout}s (command ${command_id}, last status: ${status:-unknown}). The box may still be working; check /var/lib/storytime/deployed/${SERVICE} before retrying."
              exit 1
            fi

            if ! invocation=$(aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --output json 2>/tmp/ssm-err.txt); then
              # Retry the races and the transient service errors; fail fast on
              # anything that will never resolve by waiting.
              #
              # InvocationDoesNotExist: the invocation is not registered yet,
              # for a moment after SendCommand returns.
              # Throttling / RequestLimitExceeded / ServiceUnavailable: the box
              # is still deploying and production WILL update, so exiting here
              # would paint a successful deploy red.
              # Everything else -- AccessDenied (wrong instance_id, or the
              # instance was replaced and the role's pinned ARN is stale),
              # ExpiredToken -- is surfaced immediately, because swallowing it
              # turns a one-line policy problem into a silent wait that points
              # the reader at the box instead of at the IAM.
              if grep -qE 'InvocationDoesNotExist|ThrottlingException|RequestLimitExceeded|TooManyRequestsException|ServiceUnavailable' /tmp/ssm-err.txt; then
                sleep 5
                continue
              fi
              echo "::error::get-command-invocation failed"
              cat /tmp/ssm-err.txt >&2
              exit 1
            fi

            status=$(printf '%s' "$invocation" | jq -r '.Status')
            case "$status" in
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              Success)
                # NOTE: GetCommandInvocation returns only the FIRST 24,000
                # characters of stdout. The payload keeps its output short
                # (redeploy.sh and prisma output are tailed) so the verdict
                # lines survive; if this looks truncated, read the full output
                # from the box instead of inferring from it.
                printf '%s' "$invocation" | jq -r '.StandardOutputContent'
                if [ "$DRY_RUN" = true ]; then
                  echo "dry run complete: nothing was replaced"
                else
                  echo "deploy succeeded"
                fi
                exit 0
                ;;
              *)
                # Cancelled | TimedOut | Failed | Cancelling. Every one means
                # the deploy did NOT complete, so the job must go red. The
                # box's exit code says HOW.
                printf '%s' "$invocation" | jq -r '.StandardOutputContent'
                printf '%s' "$invocation" | jq -r '.StandardErrorContent' >&2
                code=$(printf '%s' "$invocation" | jq -r '.ResponseCode // -1')
                case "$code" in
                  75) echo "::error::another deploy held the box lock (/run/lock/storytime-deploy.lock) for the whole wait. Nothing was changed; re-run when it finishes." ;;
                  3)  echo "::error::deploy aborted before any container was replaced (preflight or migration failure). The previous version is still running. See the log above." ;;
                  1)  echo "::error::the new image failed its health gate and ${SERVICE} was ROLLED BACK to the previous image. :latest was not moved." ;;
                  2)  echo "::error::DEPLOY FAILED AND ROLLBACK FAILED for ${SERVICE}. Production may be down. Follow 'Manual rollback' in docs/build-and-deploy.md now." ;;
                  *)  echo "::error::deploy ended in status ${status} (box exit ${code}, command ${command_id}). The payload may have been killed part-way: read /var/lib/storytime/deployed/${SERVICE} and 'docker ps' on the box before retrying." ;;
                esac
                exit 1
                ;;
            esac
          done

      # Only now, after the new image has been proven on the box, does it become
      # :latest. A bad image therefore never becomes the tag that a reboot, the
      # reconcile unit, or any other deploy would pick up.
      #
      # Done with the ECR API (BatchGetImage + PutImage), both of which the role
      # already holds for its own repository, rather than `buildx imagetools`,
      # which would need layer-pull permissions the role deliberately lacks. The
      # manifest is copied byte for byte by DIGEST, so :latest is exactly the
      # image that was tested, and the result is read back and compared.
      #
      # If this step fails the box is running a healthy <sha> image and :latest
      # is simply stale: re-run the workflow (it is idempotent) or move the tag
      # by hand as documented. Nothing is unhealthy.
      - name: Promote latest
        id: promote
        if: ${{ !inputs.dry_run }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          REPOSITORY: ${{ inputs.ecr_repository_prefix }}/${{ inputs.service }}
          EXPECT_DIGEST: ${{ steps.digest.outputs.digest }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_digest() {
            aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$REPOSITORY" \
              --image-ids imageTag=latest \
              --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || echo None
          }

          current=$(latest_digest)
          if [ "$current" = "$EXPECT_DIGEST" ]; then
            echo ":latest already points at ${EXPECT_DIGEST}"
            echo "promoted=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest=$(aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$REPOSITORY" \
            --image-ids "imageDigest=${EXPECT_DIGEST}" \
            --accepted-media-types application/vnd.docker.distribution.manifest.v2+json application/vnd.oci.image.manifest.v1+json \
            --query 'images[0].imageManifest' --output text)
          if [ -z "$manifest" ] || [ "$manifest" = None ]; then
            echo "::error::could not read the manifest for ${REPOSITORY}@${EXPECT_DIGEST}; :latest was NOT moved (the deployed ${IMAGE_SHA} image is healthy)"
            exit 1
          fi
          media_type=$(jq -r '.mediaType // "application/vnd.docker.distribution.manifest.v2+json"' <<<"$manifest")

          if ! aws ecr put-image --region "$AWS_REGION" --repository-name "$REPOSITORY" \
                --image-tag latest --image-manifest "$manifest" \
                --image-manifest-media-type "$media_type" >/dev/null; then
            echo "::error::put-image :latest failed. The deployed ${IMAGE_SHA} image is healthy; only the :latest tag is stale. Re-run this workflow or move the tag as documented."
            exit 1
          fi

          after=$(latest_digest)
          if [ "$after" != "$EXPECT_DIGEST" ]; then
            echo "::error::after put-image, :latest is ${after}, expected ${EXPECT_DIGEST}"
            exit 1
          fi
          echo "promoted :latest -> ${EXPECT_DIGEST} (was ${current})"
          echo "promoted=yes" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke check
        if: ${{ inputs.smoke_url != '' && !inputs.dry_run }}
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
          EXPECT: ${{ inputs.smoke_expect_status }}
        run: |
          set -euo pipefail

          # The container has just been recreated, so the first probe can land
          # before it is listening. Retry a bounded number of times rather than
          # sleeping a fixed amount: a fast service passes immediately, a slow
          # one still gets its window, and a dead one fails in ~1 minute.
          attempts=12
          delay=5
          code=000

          for i in $(seq 1 "$attempts"); do
            # --max-time bounds a hung connection; without it a black-holed
            # port would hold the step open until the job timeout.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SMOKE_URL" || echo 000)

            # Exact match against a comma-separated list. The commas on both
            # sides stop 40 matching inside 404, or 20 inside 200.
            case ",${EXPECT}," in
              *",${code},"*)
                echo "smoke check passed: ${SMOKE_URL} -> ${code} (attempt ${i})"
                exit 0
                ;;
            esac

            echo "attempt ${i}/${attempts}: ${code} (want one of ${EXPECT})"
            [ "$i" -lt "$attempts" ] && sleep "$delay"
          done

          if [ "$code" = "404" ]; then
            echo "::error::smoke check: ${SMOKE_URL} returned 404. The route does not exist — this is what a wrong API base path or an unregistered route looks like. The container may well be healthy; it is pointed at the wrong place."
          elif [ "$code" = "000" ]; then
            echo "::error::smoke check: ${SMOKE_URL} did not respond at all (connection failure or timeout) after ${attempts} attempts."
          else
            echo "::error::smoke check: ${SMOKE_URL} returned ${code}, wanted one of ${EXPECT}, after ${attempts} attempts."
          fi
          exit 1

      - name: Summary
        if: always()
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PREFIX: ${{ inputs.ecr_repository_prefix }}
          SERVICE: ${{ inputs.service }}
          IMAGE_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
        run: |
          set -euo pipefail
          {
            echo "### Deploy ${SERVICE} to ${ENVIRONMENT}"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`${REGISTRY:-<login failed>}/${ECR_PREFIX}/${SERVICE}\` |"
            echo "| deployed tag | \`${IMAGE_SHA}\` |"
            if [ "$DRY_RUN" = true ]; then
              echo "| mode | **dry run** - no container replaced, \`latest\` not moved |"
            else
              echo "| \`latest\` moved | ${PROMOTED:-no (deploy did not finish healthy)} |"
            fi
            echo "| digest | \`${DIGEST:-<not built>}\` |"
            echo "| instance | \`${INSTANCE_ID}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
